<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-labelledby="t d"><title id="t">How Farex works</title><desc id="d">Four steps: freeze the inputs, run each task on the right route and a wrong one, score by task requirements with code in a sandbox, then review a blinded sheet.</desc>
<rect width="900" height="190" rx="6" fill="#F6F4EF"/>
<rect x="20" y="20" width="200" height="150" rx="4" fill="#FFFFFF" stroke="#DAD6CC"/>
<text x="36" y="48" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8A5512">1 · freeze</text>
<text x="36" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555A63">Tasks, prompts, scorers</text>
<text x="36" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555A63">and config are hashed.</text>
<rect x="240" y="20" width="200" height="150" rx="4" fill="#FFFFFF" stroke="#DAD6CC"/>
<text x="256" y="48" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8A5512">2 · run</text>
<text x="256" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555A63">Every task goes to the</text>
<text x="256" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555A63">right route and a wrong one.</text>
<rect x="460" y="20" width="200" height="150" rx="4" fill="#FFFFFF" stroke="#DAD6CC"/>
<text x="476" y="48" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8A5512">3 · score</text>
<text x="476" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555A63">By task requirements;</text>
<text x="476" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555A63">code runs in a sandbox.</text>
<rect x="680" y="20" width="200" height="150" rx="4" fill="#FFFFFF" stroke="#DAD6CC"/>
<text x="696" y="48" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8A5512">4 · review</text>
<text x="696" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555A63">A blinded sheet hides</text>
<text x="696" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#555A63">which route answered.</text>
<path d="M224 95h12m-5-5l5 5-5 5" fill="none" stroke="#555A63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M444 95h12m-5-5l5 5-5 5" fill="none" stroke="#555A63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M664 95h12m-5-5l5 5-5 5" fill="none" stroke="#555A63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="none" stroke="#0F1114" stroke-width="1.5"><rect x="36" y="66" width="34" height="42" rx="3"/><path d="M44 80h18M44 88h18M44 96h12"/></g>
<path d="M256 100H372" stroke="#66718A" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M256 100H300L312 76H372" fill="none" stroke="#B5701A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="312" cy="76" r="3.5" fill="#B5701A"/>
<text x="380" y="104" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#555A63">ref</text><text x="380" y="80" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#555A63">wrong</text>
<g fill="none" stroke="#0F1114" stroke-width="1.5"><rect x="476" y="66" width="44" height="40" rx="3"/><path d="M486 80l6 6-6 6M498 92h12"/></g>
<g fill="none" stroke="#0F1114" stroke-width="1.5"><rect x="696" y="66" width="44" height="40" rx="3"/><path d="M704 78h28M704 86h28M704 94h28"/><rect x="718" y="74" width="16" height="24" fill="#0F1114" stroke="none" opacity=".85"/></g>
</svg>
